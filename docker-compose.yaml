services:
  postgres:
    image: postgres:16-alpine
    container_name: libris-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - libris_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - libris-network

  redis:
    image: redis:7-alpine
    container_name: libris-cache
    ports:
      - "${CACHE_PORT}:6379"
    volumes:
      - libris_redisdump:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  libris_pgdata:
  libris_redisdump:

networks:
  libris-network:
    driver: bridge