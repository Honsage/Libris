services:
  postgres:
    image: postgres:16-alpine
    container_name: libris-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - libris_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - libris-network

volumes:
  libris_pgdata:

networks:
  libris-network:
    driver: bridge